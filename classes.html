<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<body>
<div class="container">
  <!-- زر القفل-->
  <div style="display: flex; align-items: center; justify-content: center; gap: 7px; margin-bottom: 16px;">
    <h1 style="margin:0;font-size:2.1em;color:#14223A;font-weight:900;letter-spacing:1px;">جدول القاعات الدراسية</h1>
    <span id="userIcon"
      style="font-size:2em;cursor:pointer;"
      title="تسجيل دخول الفريق"
      onclick="goToReport()">
      👤
    </span>
    <button id="logoutBtn" onclick="doLogout()" title="تسجيل الخروج"
      style="display:none; background:#fee2e2; color:#b91c1c; border:none; border-radius:12px; padding:7px 14px; font-size:0.95em; font-weight:bold; cursor:pointer; font-family:'Cairo',Tahoma,Arial,sans-serif;">
      🚪 خروج
    </button>
  </div>

  <!-- البحث -->
  <div class="search-group" style="display:flex;flex-direction:column;align-items:center;margin-bottom:18px;">
    <label style="font-size:1.1em;font-weight:600;margin-bottom:7px;"></label>
    <input type="text" id="searchInput" class="search-input" placeholder="أدخل رقم القاعة" oninput="renderTable()"/>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;">
    <div class="filter-group" style="display:flex; gap:12px;">
      <button id="allBtn" onclick="filterByBuilding('all')" class="filter-btn active">✖</button>
      <button id="northBtn" onclick="filterByBuilding('الشمالي')" class="filter-btn">المبنى الشمالي</button>
      <button id="southBtn" onclick="filterByBuilding('الجنوبي')" class="filter-btn">المبنى الجنوبي</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="add-btn filter-btn" id="addClassBtn" onclick="addClassFlow()" style="margin-bottom:0;">
        إضافة قاعة دراسية +
      </button>
      <button id="roleManagerBtn" onclick="openRoleManager()" title="إدارة صلاحيات المستخدمين"
        style="display:none; background:#e5ebf1; border:none; border-radius:14px; padding:10px 16px; font-size:1.3em; cursor:pointer;">
        ⚙️
      </button>
    </div>
  </div>

  <div class="table-responsive" style="overflow-x:auto; width:100%;">
    <table>
      <thead>
        <tr>
          <th>الحالة</th>
          <th>المبنى</th>
          <th>الدور</th>
          <th>نوع القاعة</th>
          <th>رقم القاعة</th>
          <th>السعة</th>
          <th>بوديوم</th>
          <th>الكمبيوتر</th>
          <th>الشبكة</th>
          <th>جهاز العرض</th>
          <th>جهاز العرض</th>
          <th>الميكروفون</th>
          <th>الإضاءة </th>
          <th>الستائر</th>
          <th>ملاحظات</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyDqMFfWwtzXInusoxsJxgEO5_ptz_fRk6E",
  authDomain: "itu-coa.firebaseapp.com",
  projectId: "itu-coa",
  storageBucket: "itu-coa.firebasestorage.app",
  messagingSenderId: "790497191019",
  appId: "1:790497191019:web:a5b4de6f65574457503d2e",
  measurementId: "G-D5L66D3QZP"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const collectionName = "classes";

let allClasses = [];
let currentBuildingFilter = "all";
let currentUser = "";
let isAdmin = false;
let userData = {}; // بيانات صلاحيات المستخدم الحالي (role, editPermissions) من مجموعة users

// authReady: وعد ينتظره أي كود يحتاج يعرف حالة تسجيل الدخول قبل ما يقرر يطلب دخول أو لا
let resolveAuthReady;
const authReady = new Promise(resolve => { resolveAuthReady = resolve; });
let authCheckedOnce = false;

auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user.email;
    document.getElementById("logoutBtn").style.display = "inline-block";
    await ensureUserDoc(user);
    try {
      const doc = await db.collection("users").doc(user.uid).get();
      userData = doc.exists ? doc.data() : {};
      if (userData.role === "admin") {
        isAdmin = true;
        document.getElementById("addClassBtn").style.display = "inline-block";
        document.getElementById("roleManagerBtn").style.display = "inline-block";
      }
    } catch (e) {
      userData = {};
    }
  } else {
    currentUser = "";
    isAdmin = false;
    userData = {};
    document.getElementById("logoutBtn").style.display = "none";
    document.getElementById("addClassBtn").style.display = "none";
    document.getElementById("roleManagerBtn").style.display = "none";
  }
  if (!authCheckedOnce) {
    authCheckedOnce = true;
    resolveAuthReady();
  }
});

function doLogout() {
  auth.signOut().then(() => {
    Swal.fire({ title: 'تم تسجيل الخروج', icon: 'success', timer: 900, showConfirmButton: false });
  });
}

// يتأكد من تسجيل الدخول قبل تنفيذ أي إجراء — يسأل مرة وحدة بس لو ما فيه جلسة أصلاً
function ensureLoggedIn(onSuccess) {
  authReady.then(() => {
    if (auth.currentUser) {
      onSuccess();
      return;
    }
    showLoginDialog(onSuccess);
  });
}

// تحميل البيانات (القراءة عامة، لا تحتاج تسجيل دخول)
function loadTable() {
  db.collection(collectionName).onSnapshot(snapshot => {
    allClasses = [];
    snapshot.forEach(doc => {
      allClasses.push(doc.data());
    });
    renderTable();
  });
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  const searchTerm = document.getElementById('searchInput').value.trim();
  let filtered = allClasses;

  if (searchTerm) {
    filtered = allClasses.filter(d =>
      (d.no && d.no.toString().includes(searchTerm)) ||
      (d.type && d.type.includes(searchTerm)) ||
      (d.remark && d.remark.includes(searchTerm))
    );
  } else if (currentBuildingFilter !== "all") {
    filtered = filtered.filter(d => (d.building || "").trim() === currentBuildingFilter);
  }

  tbody.innerHTML = "";
  if (filtered.length === 0) {
    tbody.innerHTML = "<tr><td colspan='12'>لا توجد بيانات</td></tr>";
    return;
  }

  filtered.forEach(d => {
    const row = `<tr>
      <td>${d.status || ""}</td>
      <td>${d.building || ""}</td>
      <td>${d.floor || ""}</td>
      <td>${d.type || ""}</td>
      <td>${d.no || ""}</td>
      <td>${d.cap || ""}</td>
      <td>${d.podium || ""}</td>
      <td>${d.pc || ""}</td>
      <td>${d.network || ""}</td>
      <td>${d.proj1 || ""}</td>
      <td>${d.proj2 || ""}</td>
      <td>${d.mic || ""}</td>
      <td>${d.light || ""}</td>
      <td>${d.curtain || ""}</td>
      <td>${d.remark || ""}</td>
    </tr>`;
    tbody.innerHTML += row;
  });
}

// تسجيل بريد المستخدم بمجموعة users (مرة وحدة، أول ما يسجل دخول) عشان يظهر بلوحة إدارة الصلاحيات
async function ensureUserDoc(user) {
  try {
    const ref = db.collection("users").doc(user.uid);
    const snap = await ref.get();
    if (!snap.exists) {
      await ref.set({ email: user.email });
    } else if (!snap.data().email && user.email) {
      // مستند قديم اتسوى يدوياً بدون حقل email — نكمله الحين
      await ref.set({ email: user.email }, { merge: true });
    }
  } catch (e) {
    // تجاهل بصمت، مو حرج
  }
}

// تسجيل دخول موحّد (Firebase Auth) — يستخدم لأي إجراء يحتاج تسجيل دخول، مرة وحدة بس بالجلسة
function showLoginDialog(onSuccess) {
  Swal.fire({
    title: 'تسجيل الدخول',
    html: `<input id="swal-email" type="email" class="swal2-input" placeholder="البريد الإلكتروني">
           <input id="swal-password" type="password" class="swal2-input" placeholder="كلمة المرور">`,
    confirmButtonText: 'دخول',
    showCancelButton: true,
    preConfirm: async () => {
      const email = document.getElementById('swal-email').value.trim();
      const password = document.getElementById('swal-password').value.trim();
      if (!email || !password) {
        Swal.showValidationMessage('أدخل جميع البيانات');
        return false;
      }
      try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        await ensureUserDoc(cred.user);
        const roleDoc = await db.collection("users").doc(cred.user.uid).get();
        userData = roleDoc.exists ? roleDoc.data() : {};
        currentUser = email;
        if (userData.role === "admin") {
          isAdmin = true;
          document.getElementById("addClassBtn").style.display = "inline-block";
          document.getElementById("roleManagerBtn").style.display = "inline-block";
        }
        return true;
      } catch (err) {
        Swal.showValidationMessage('البريد الإلكتروني أو كلمة المرور غير صحيحة');
        return false;
      }
    }
  }).then((result) => {
    if (result.isConfirmed && result.value === true) {
      Swal.fire({
        title: '✅ تم تسجيل الدخول',
        icon: 'success',
        timer: 900,
        showConfirmButton: false
      });
      onSuccess();
    }
  });
}

// لوحة إدارة صلاحيات المستخدمين (بس للأدمن) — تحدد لكل إيميل صلاحية admin و/أو it
const BUILDINGS = [
  { key: "الشمالي", short: "شمالي" },
  { key: "الجنوبي", short: "جنوبي" }
];
const FLOORS = ["G", "1", "2", "3", "4"];

async function openRoleManager() {
  Swal.fire({ title: 'جاري تحميل المستخدمين...', didOpen: () => Swal.showLoading() });
  let rows = [];
  try {
    const snapshot = await db.collection("users").get();
    snapshot.forEach(doc => {
      const d = doc.data();
      rows.push({
        uid: doc.id,
        email: d.email || "(بدون بريد مسجل)",
        role: d.role === "admin",
        editPermissions: Array.isArray(d.editPermissions) ? d.editPermissions : []
      });
    });
  } catch (e) {
    Swal.fire('خطأ', 'فشل تحميل المستخدمين: ' + e.message, 'error');
    return;
  }

  if (rows.length === 0) {
    Swal.fire('لا يوجد مستخدمون بعد', 'لسا ما فيه أي شخص سجل دخول بالموقع.', 'info');
    return;
  }

  function permCheckboxes(row) {
    return BUILDINGS.map(b => `
      <div style="margin-bottom:4px;">
        <span style="font-size:11px;font-weight:700;color:#334;">${b.short}:</span>
        ${FLOORS.map(f => {
          const key = b.key + "-" + f;
          const checked = row.editPermissions.includes(key) ? "checked" : "";
          return `<label style="display:inline-flex;align-items:center;gap:2px;border:1px solid #e2e8f0;border-radius:6px;padding:2px 5px;margin:1px;font-size:11px;">
            <input type="checkbox" class="perm-cb" data-key="${key}" ${checked}> ${f}
          </label>`;
        }).join('')}
      </div>`).join('');
  }

  let html = `<div style="max-height:440px;overflow-y:auto;text-align:right;direction:rtl;">
    <table style="width:100%;border-collapse:collapse;font-family:'Cairo',Tahoma,Arial,sans-serif;">
      <thead>
        <tr>
          <th style="padding:8px;border-bottom:2px solid #ddd;text-align:right;">البريد الإلكتروني</th>
          <th style="padding:8px;border-bottom:2px solid #ddd;">أدمن<br><span style="font-weight:400;font-size:0.8em;">(كل الصلاحيات)</span></th>
          <th style="padding:8px;border-bottom:2px solid #ddd;">الأدوار المسموح تعديلها (حسب المبنى)</th>
        </tr>
      </thead>
      <tbody>`;
  rows.forEach(r => {
    html += `<tr data-uid="${r.uid}">
      <td style="padding:8px;border-bottom:1px solid #f0f0f0;vertical-align:top;">${r.email}</td>
      <td style="padding:8px;border-bottom:1px solid #f0f0f0;text-align:center;vertical-align:top;"><input type="checkbox" class="role-admin-cb" style="width:20px;height:20px;" ${r.role ? "checked" : ""}></td>
      <td style="padding:8px;border-bottom:1px solid #f0f0f0;">${permCheckboxes(r)}</td>
    </tr>`;
  });
  html += `</tbody></table></div>
  <p style="font-size:12px;color:#888;margin-top:8px;">ملاحظة: "أدمن" يعطي صلاحية كاملة (إضافة قاعات + تعديل كل الأدوار) بغض النظر عن الأدوار المحددة تحت.</p>`;

  Swal.fire({
    title: '⚙️ إدارة صلاحيات المستخدمين',
    width: 750,
    html: html,
    confirmButtonText: 'حفظ التغييرات',
    showCancelButton: true,
    cancelButtonText: 'إغلاق',
    preConfirm: async () => {
      const trs = document.querySelectorAll('tr[data-uid]');
      try {
        for (const tr of trs) {
          const uid = tr.getAttribute('data-uid');
          const wantsAdmin = tr.querySelector('.role-admin-cb').checked;
          const permCbs = tr.querySelectorAll('.perm-cb');
          const editPermissions = [];
          permCbs.forEach(cb => { if (cb.checked) editPermissions.push(cb.getAttribute('data-key')); });

          const data = { editPermissions };
          if (wantsAdmin) {
            data.role = "admin";
          } else {
            data.role = firebase.firestore.FieldValue.delete();
          }
          await db.collection("users").doc(uid).update(data);
        }
        return true;
      } catch (e) {
        Swal.showValidationMessage('فشل الحفظ: ' + e.message);
        return false;
      }
    }
  }).then((result) => {
    if (result.isConfirmed && result.value === true) {
      Swal.fire({ title: 'تم الحفظ بنجاح', icon: 'success', timer: 1200, showConfirmButton: false });
    }
  });
}


function filterByBuilding(building) {
  currentBuildingFilter = building;
  document.getElementById("northBtn").classList.remove("active");
  document.getElementById("southBtn").classList.remove("active");
  document.getElementById("allBtn").classList.remove("active");
  if (building === "الجنوبي") document.getElementById("southBtn").classList.add("active");
  else if (building === "الشمالي") document.getElementById("northBtn").classList.add("active");
  else document.getElementById("allBtn").classList.add("active");
  renderTable();
}

function goToReport() {
  ensureLoggedIn(() => {
    window.location.href = "https://aisha-alhuwais.github.io/follow-up/report.html";
  });
}

function addClassFlow() {
  ensureLoggedIn(() => {
    if (isAdmin) {
      openAddSwal();
    } else {
      Swal.fire('لا تملك صلاحية', 'ليس لديك صلاحية إضافة قاعات دراسية.', 'warning');
    }
  });
}

function openAddSwal() {
  Swal.fire({
    title: `<div style="font-weight:900; font-size:1.3em; color:#1a3765; margin-bottom:5px; letter-spacing:1px;">➕ إضافة قاعة دراسية</div>`,
    width: 900,
    customClass: {
      popup: 'swal-wide-modal'
    },
    html:
    `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div>
        <label style="font-weight:700;">الحالة</label>
        <select id="swal-status" class="swal2-input" style="width:100%;">
          <option>🔴</option>
          <option>🟡</option>
          <option>🟢</option>
        </select>
      </div>
      <div>
        <label style="font-weight:700;">المبنى</label>
        <select id="swal-building" class="swal2-input" style="width:100%;">
          <option>الجنوبي</option>
          <option>الشمالي</option>
        </select>
      </div>
      <div>
        <label style="font-weight:700;">الدور</label>
        <select id="swal-floor" class="swal2-input" style="width:100%;">
          <option>G</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
        </select>
      </div>
      <div>
        <label style="font-weight:700;">نوع القاعة</label>
        <select id="swal-type" class="swal2-input" style="width:100%;">
          <option>فصل دراسي</option>
          <option>غرفة تدريب</option>
          <option>غرفة إجتماعات</option>
          <option>قاعة عرض</option>
          <option>مختبر اللغات</option>
          <option>مختبر الحاسوب</option>
          <option>تدريب مسرحي</option>
          <option>مختبر التصوير الصحفي</option>
          <option>مختبر التحرير</option>
          <option>إنتاج الصحف</option>
          <option>مختبر وسائل الإعلام الرقمية</option>
          <option>مختبر الدعاية والإعلان</option>
          <option>مختبر الوسائط المتعددة</option>
          <option>الإخراج الإذاعي</option>
          <option>المسرح الأسود</option>
        </select>
      </div>
      <div>
        <label style="font-weight:700;">رقم القاعة</label>
        <input id="swal-no" class="swal2-input" placeholder="رقم القاعة" required>
      </div>
      <div>
        <label style="font-weight:700;">السعة</label>
        <input id="swal-cap" class="swal2-input" placeholder="عدد المقاعد" required>
      </div>
      <div>
        <label style="font-weight:700;">بوديوم</label>
        <select id="swal-podium" class="swal2-input" style="width:100%;">
          <option>-</option>
          <option>شغال</option>
          <option>قيد الصيانة</option>
          <option>غير شغال</option>
        </select>
      </div>
      <div>
        <label style="font-weight:700;">الكمبيوتر</label>
        <select id="swal-pc" class="swal2-input" style="width:100%;">
          <option>-</option>
          <option>شغال</option>
          <option>قيد الصيانة</option>
          <option>غير شغال</option>
        </select>
      </div>
      <div>
        <label style="font-weight:700;">الشبكة</label>
        <select id="swal-network" class="swal2-input" style="width:100%;">
          <option>-</option>
          <option>متصل</option>
          <option>غير متصل</option>
        </select>
      </div>
      <div>
        <label style="font-weight:700;">جهاز العرض</label>
        <select id="swal-proj1" class="swal2-input" style="width:100%;">
          <option>-</option>
          <option>شغال</option>
          <option>قيد الصيانة</option>
          <option>غير شغال</option>
        </select>
      </div>
      <div>
        <label style="font-weight:700;">جهاز العرض</label>
        <select id="swal-proj2" class="swal2-input" style="width:100%;">
          <option>-</option>
          <option>شغال</option>
          <option>قيد الصيانة</option>
          <option>غير شغال</option>
        </select>
      </div>
      <div>
        <label style="font-weight:700;">الميكروفون</label>
        <select id="swal-mic" class="swal2-input" style="width:100%;">
          <option>-</option>
          <option>شغال</option>
          <option>قيد الصيانة</option>
          <option>غير شغال</option>
        </select>
      </div>
      <div>
        <label style="font-weight:700;">الإضاءة</label>
        <select id="swal-light" class="swal2-input" style="width:100%;">
          <option>-</option>
          <option>شغال</option>
          <option>قيد الصيانة</option>
          <option>غير شغال</option>
        </select>
      </div>
      <div>
        <label style="font-weight:700;">الستائر</label>
        <select id="swal-curtain" class="swal2-input" style="width:100%;">
          <option>-</option>
          <option>شغال</option>
          <option>قيد الصيانة</option>
          <option>غير شغال</option>
        </select>
      </div>
      <div style="grid-column:1/-1;">
        <label style="font-weight:700;">ملاحظات</label>
        <textarea id="swal-remark" class="swal2-textarea"
          placeholder="اكتب أي ملاحظة هنا"
          style="width:80%;min-height:34px;max-height:100px;resize:vertical;text-align:right;"></textarea>
      </div>
    </div>`,
    confirmButtonText: 'إضافة',
    showCancelButton: 'true',
    cancelButtonText: "إلغاء",
    preConfirm: () => {
      const get = id => document.getElementById(id).value;
      if (!get('swal-no') || !get('swal-cap')) {
        Swal.showValidationMessage('يجب إدخال رقم القاعة والسعة');
        return false;
      }
      return {
        status: get('swal-status'),
        building: get('swal-building'),
        floor: get('swal-floor'),
        type: get('swal-type'),
        no: get('swal-no'),
        cap: get('swal-cap'),
        podium: get('swal-podium'),
        pc: get('swal-pc'),
        network: get('swal-network'),
        proj1: get('swal-proj1'),
        proj2: get('swal-proj2'),
        mic: get('swal-mic'),
        light: get('swal-light'),
        curtain: get('swal-curtain'),
        remark: get('swal-remark')
      };
    }
  }).then((result) => {
    if (result.isConfirmed && result.value) {
      db.collection("classes").add(result.value)
        .then(() => {
          Swal.fire('تمت الإضافة!', 'تم إضافة الفصل بنجاح', 'success');
          loadTable();
        })
        .catch(() => {
          Swal.fire('خطأ', 'حدث خطأ أثناء الإضافة!', 'error');
        });
    }
  });
}

document.addEventListener("DOMContentLoaded", loadTable);
</script>
</body>
</html>
